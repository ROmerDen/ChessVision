name: ChessVision Android CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build Stockfish for Android ARM64
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-${ANDROID_NDK:-}}}"
          echo "Using NDK: $ANDROID_NDK_HOME"
          test -n "$ANDROID_NDK_HOME"
          scripts/build_stockfish.sh

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChessVision-with-Stockfish
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
